features:
  - package: github.com/kgatilin/signet/testdata/sdk
    test: TestPassing
    feature: Passing feature
    description: |-
      First line.
      Second line.
    status: pass
    duration: 70ms
    background:
      - text: a shared file
        scope: feature
        status: pass
      - text: a fresh counter
        scope: scenario
        status: pass
    scenarios:
      - id: one
        name: every step kind passes
        status: pass
        duration: 50ms
        steps:
          - given: n is one
            status: pass
          - when: n doubles
            status: pass
            then:
              - text: n is two
                status: pass
              - text: n is even
                status: pass
          - then: the shared file exists
            status: pass
          - then: the per-scenario file outlives its background step
            status: pass
      - id: two
        name: the shared background ran once
        status: pass
        duration: 10ms
        steps:
          - when: nothing happens
            status: pass
            then:
              - text: the shared file still exists
                status: pass
          - when: it is checked again
            status: pass
            then:
              - text: the background ran once
                status: pass
  - package: github.com/kgatilin/signet/testdata/sdk
    test: TestStepFailures
    feature: Step failures
    status: fail
    scenarios:
      - id: when-fails
        name: a failed action skips its checks and later actions
        status: fail
        steps:
          - when: the action fails
            status: fail
            error: |-
              fixture_test.go:99: action broke
              second line
            then:
              - text: its check
                status: skip
          - when: a later action
            status: skip
            then:
              - text: a later check
                status: skip
      - id: then-fails
        name: a failed check keeps its siblings and skips later actions
        status: fail
        steps:
          - when: the action passes
            status: fail
            then:
              - text: the first check fails
                status: fail
                error: 'fixture_test.go:107: first check broke'
              - text: the second check runs
                status: pass
          - when: a later action
            status: skip
      - id: given-fails
        name: a failed precondition skips everything after it
        status: fail
        steps:
          - given: a broken precondition
            status: fail
            error: 'fixture_test.go:113: precondition broke'
          - then: a direct check
            status: skip
          - when: an action
            status: skip
      - id: skip-in-when
        name: a skipped action skips its checks
        status: pass
        steps:
          - when: the action skips
            status: skip
            then:
              - text: its check
                status: skip
      - id: cleanup-fails
        name: a failed cleanup registered in a Given fails the scenario
        status: fail
        error: 'fixture_test.go:125: teardown broke'
        steps:
          - given: a resource whose teardown fails
            status: pass
          - then: a check that passes
            status: pass
  - package: github.com/kgatilin/signet/testdata/sdk
    test: TestBackgroundOnceFails
    feature: Broken background
    status: fail
    duration: 380ms
    log: |-
      service.go:77: signet: service dying output:
        listen: address already in use
    background:
      - text: a service that does not start
        scope: feature
        status: fail
        error: 'fixture_test.go:137: signet: service dying exited before it was ready (exit status 1); waiting for "listening" in the output'
    scenarios:
      - id: first
        name: runs the background
        status: fail
        duration: 380ms
        error: 'background "a service that does not start" failed: fixture_test.go:137: signet: service dying exited before it was ready (exit status 1); waiting for "listening" in the output'
        steps:
          - when: an action
            status: skip
      - id: second
        name: is skipped
        status: skip
        steps:
          - when: an action
            status: skip
            then:
              - text: a check
                status: skip
  - package: github.com/kgatilin/signet/testdata/sdk
    test: TestBackgroundFails
    feature: Broken per-scenario background
    status: fail
    background:
      - text: a fixture that fails in one scenario
        scope: scenario
        status: fail
        error: 'fixture_test.go:153: fixture broke'
    scenarios:
      - id: bad
        name: its background fails
        status: fail
        error: 'background "a fixture that fails in one scenario" failed: fixture_test.go:153: fixture broke'
        steps:
          - when: an action
            status: skip
      - id: good
        name: its background passes
        status: pass
        steps:
          - when: an action
            status: pass
  - package: github.com/kgatilin/signet/testdata/sdk
    test: TestFailureOutput
    feature: Failure output
    status: fail
    duration: 400ms
    log: |-
      service.go:77: signet: service once-svc output:
        bg-once-svc-out
      command.go:234: signet: last 1 command(s):
      $ /bin/sh -c "echo bg-once-cmd-out"  (exit 0, 53ms)
      stdout:
        bg-once-cmd-out
    background:
      - text: a shared service and command
        scope: feature
        status: pass
      - text: a per-scenario command
        scope: scenario
        status: pass
    scenarios:
      - id: later-step-fails
        name: background fixtures log their commands and service output when a later step fails
        status: fail
        duration: 200ms
        log: |-
          command.go:234: signet: last 1 command(s):
          $ /bin/sh -c "echo bg-each-cmd-out"  (exit 0, 37ms)
          stdout:
            bg-each-cmd-out
        steps:
          - when: the step fails
            status: fail
            error: 'fixture_test.go:178: boom after background'
      - id: commands-in-steps
        name: a failed check logs its own commands, and the scenario logs those of its steps once
        status: fail
        duration: 170ms
        log: |-
          command.go:234: signet: last 3 command(s):
          $ /bin/sh -c "echo bg-each-cmd-out"  (exit 0, 34ms)
          stdout:
            bg-each-cmd-out
          $ /bin/sh -c "echo given-cmd-out"  (exit 0, 38ms)
          stdout:
            given-cmd-out
          $ /bin/sh -c "echo when-cmd-out"  (exit 0, 44ms)
          stdout:
            when-cmd-out
        steps:
          - given: a command in a Given
            status: pass
            duration: 40ms
          - when: a command in a When
            status: fail
            duration: 100ms
            then:
              - text: a check with a command fails
                status: fail
                duration: 60ms
                error: 'fixture_test.go:189: /bin/sh -c "echo then-cmd-out; exit 3": exit 3, want 0'
                log: |-
                  command.go:234: signet: last 1 command(s):
                  $ /bin/sh -c "echo then-cmd-out; exit 3"  (exit 3, 57ms)
                  stdout:
                    then-cmd-out
  - package: github.com/kgatilin/signet/testdata/sdk
    test: TestStepResources
    feature: Step resources
    status: pass
    duration: 160ms
    scenarios:
      - id: outlive-step
        name: what a Given or When creates lives until the scenario ends
        status: pass
        duration: 160ms
        steps:
          - given: a temporary directory
            status: pass
            duration: 10ms
          - when: a service starts
            status: pass
            duration: 100ms
            then:
              - text: the directory of the Given still exists
                status: pass
          - when: a later action runs
            status: pass
            duration: 20ms
            then:
              - text: the service of the earlier When is still running
                status: pass
                duration: 20ms
